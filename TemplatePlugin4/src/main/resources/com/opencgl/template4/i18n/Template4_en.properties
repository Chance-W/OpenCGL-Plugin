label.name=Plugin Dev 4 - Shade Isolation Demo
label.category=Plugin Template
label.description=Demonstrate solving TCCL conflicts via Maven Shade relocation
label.info_header=[Maven Shade Plugin - Dependency & SPI Shadow Isolation Demo]
label.info_body=This plugin references org.apache.zookeeper and org.slf4j which easily conflict with the global environment.\nBy configuring <relocations> and ServicesResourceTransformer in pom.xml:\n1. Their names are forcibly renamed to current plugin private domain.\n2. The underlying SPI files (META-INF/services) are safely converted.\n\nYou can click the buttons below to test calling host-provided classes vs isolated classes!
btn.probe_zk_global=Probe Global Zookeeper
btn.probe_zk_shaded=Probe Shaded Zookeeper
btn.probe_slf4j_global=Probe Global SLF4J
btn.probe_slf4j_shaded=Probe Isolated SLF4J(2.0.16)
btn.clear_logs=Clear Logs

tooltip.probe_zk_global=Probe host/IDE for org.apache.zookeeper.ZooKeeper
tooltip.probe_zk_shaded=Probe plugin-isolated shaded ZooKeeper class
tooltip.probe_slf4j_global=Probe host/IDE for org.slf4j.LoggerFactory
tooltip.probe_slf4j_shaded=Probe plugin-isolated SLF4J 2.0.16
tooltip.clear_logs=Clear the log output area

log.probing_original=🚀 Probing original path ({0})...
log.warn_found=⚠️ [WARNING] Found it! This means {0} exists in your main program (or IDE).\nDue to parent-first delegation, this plugin is **using the host library**!\nActual path: {1}\nThis is extremely dangerous in production (leads to ClassCastException or version conflicts)!
log.ok_intercepted=✅ [OK] Environment verified! Original {0} does not exist in host. Global conflict avoided.
log.error_probe=❌ Exception during original probe: {0}

log.probing_shaded=🛡️ Probing Shade sandbox isolation ({0})...
log.success_verify=🎯 [Verified!] Found the relocated identity after Shade renaming:\n -> {0}
log.jar_location=📦 Its loading path is strictly limited within the current JAR:\n -> {0}
log.security_line=Security line established! No matter if host has an old version of {0}, the plugin only calls its own isolated environment!
log.fail_shaded=❌ [Failed] Relocated class not found. Usually means Maven shade config/order is wrong or running in un-shaded IDE environment. Error: {0}

log.slf4j_instance=🎯 [Verified!] Found plugin-exclusive SLF4J (2.0.16) instance:\n -> {0}
log.slf4j_exclusive=Now all logging frameworks inside the plugin will use this exclusive 2.0.16 version!
