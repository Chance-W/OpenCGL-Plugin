label.name=插件开发4-Shade隔离演示插件
label.category=插件开发模板
label.description=演示通过 Maven Shade 重定位彻底解决 Dubbo/Zookeeper 等 TCCL 冲突
label.info_header=【Maven Shade Plugin - 依赖及SPI包阴影隔离演示】
label.info_body=该插件引用了容易与全局发生深层冲突的 org.apache.zookeeper 以及 org.slf4j。\n通过配置 pom.xml 的 <relocations> 和 ServicesResourceTransformer 节点：\n1. 它们的名字被强行重命名为当前插件私有域。\n2. 其底层的 SPI 寻址文件 (META-INF/services) 被一并安全转换。\n\n您可以点击下方按钮，分别测试调用宿主自带的类和插件内物理隔离的类，从而完美验证此防弹方案！
btn.probe_zk_global=探测全局 Zookeeper
btn.probe_zk_shaded=探测隔离 Zookeeper
btn.probe_slf4j_global=探测全局 SLF4J
btn.probe_slf4j_shaded=探测隔离 SLF4J(2.0.16)
btn.clear_logs=清空日志

tooltip.probe_zk_global=探测宿主/IDE 中是否存在 org.apache.zookeeper.ZooKeeper
tooltip.probe_zk_shaded=探测插件内隔离的 Shade 化 ZooKeeper 类
tooltip.probe_slf4j_global=探测宿主/IDE 中是否存在 org.slf4j.LoggerFactory
tooltip.probe_slf4j_shaded=探测插件内隔离的 SLF4J 2.0.16
tooltip.clear_logs=清空下方日志输出区域

log.probing_original=🚀 正在探测原版路径 ({0})...
log.warn_found=⚠️ [警告] 居然找到了！这说明：您当前主程序(或IDE)中存在 {0}。\n由于双亲委派机制，此插件直接透传调用并**借用了宿主的类库**！\n真凶加载路径: {1}\n这在真实生产环境中极度危险(容易产生 ClassCastException 或版本冲突)！
log.ok_intercepted=✅ [正常拦截] 环境正常验证！当前宿主应用内原本的 {0} 不存在。避免了潜在的全局冲突。
log.error_probe=❌ 探测原装库时发生异常: {0}

log.probing_shaded=🛡️ 正在探测 Shade 沙盒隔离包 ({0})...
log.success_verify=🎯 [成功验证!] 我们找到了由于 Shade 重命名后的新身份：\n -> {0}
log.jar_location=📦 它的所属加载路径被严格限制在当前的 JAR 内：\n -> {0}
log.security_line=安全防线已确立！此时不管宿主里有没有旧版本的 {0} 干涉，插件只会调用本 JAR 内独有的隔离环境！
log.fail_shaded=❌ [失败] 寻找被 Shade 的类不存在。这通常意味着 Maven打包机制/顺序有误或是运行在未经 Shade 的 IDE Classes 环境下。具体报错: {0}

log.slf4j_instance=🎯 [成功验证!] 我们找到了插件专属的 SLF4J (2.0.16) 实例：\n -> {0}
log.slf4j_exclusive=现在，插件内部的所有日志框架都将使用该专属 2.0.16 版本，彻底拒绝与外部旧版框架抢坑！
