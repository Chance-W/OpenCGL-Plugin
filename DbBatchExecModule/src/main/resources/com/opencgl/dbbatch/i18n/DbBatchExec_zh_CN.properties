help.content=【参数替换说明】\n1. 基本替换\n   SQL 中使用 ${key}，下方 JSON 配置 {\"key\": \"value\"}。\n\n2. 动态系统变量\n   在 JSON Value 中使用，执行时自动替换：\n   - ${UUID} : 生成随机 UUID\n   - ${TIMESTAMP} : 当前毫秒时间戳\n   - ${yyyyMMdd} / ${yyyy-MM-dd HH:mm:ss} : 当前时间格式化\n\n3. 批量生成 (Loop)\n   支持多种模式批量生成递增数据。\n   (A) 按 日期/时间 递增 (BATCH_DATE)\n   (B) 按 数字 递增 (BATCH_INT)\n   (C) 枚举列表循环 (BATCH_ENUM)\n   (D) 随机整数 (BATCH_RANDOM_INT)
